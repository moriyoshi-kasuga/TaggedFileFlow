[package]
name = "tagged_file_flow"
version = "4.0.0"
edition = "2024"
description = "Efficient File Management with Tagging"

[[bin]]
name = "tff"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dirs = "=7.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
anyhow = "=1.0.104"
color-print = "=0.3.7"
rand = "=0.10.2"
fs-more = "=0.8.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
