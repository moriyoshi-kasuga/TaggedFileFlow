[package]
name = "tagged_file_flow"
version = "4.0.0"
edition = "2024"
description = "Efficient File Management with Tagging"

[[bin]]
name = "tff"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
dirs = "=6.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
anyhow = "=1.0.103"
color-print = "=0.3.7"
rand = "=0.10.2"
fs-more = "=0.8.1"

[lints.rust]
nonstandard_style = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
